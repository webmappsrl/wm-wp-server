# Un solo sito alla volta: SITE_NAME e SITE_ROOT arrivano dall'ambiente del container.
# SITE_ROOT è lo stesso percorso della docroot di produzione, perché .htaccess e .user.ini
# dei siti (es. auto_prepend_file del WAF Wordfence) usano percorsi assoluti.
<VirtualHost *:443>
    ServerName ${SITE_NAME}
    DocumentRoot ${SITE_ROOT}
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key
    <Directory ${SITE_ROOT}>
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog /var/log/php/apache-error.log
</VirtualHost>
