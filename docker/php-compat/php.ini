; Valori di php.ini allineati al server di produzione — oc:8834
; In locale si registrano anche le Deprecated (error_reporting=E_ALL), da contare con
; scripts/php-migration/classify-php-log.sh; in produzione restano escluse.
memory_limit = 1G
upload_max_filesize = 50M
post_max_size = 50M
max_execution_time = 60
display_errors = Off
log_errors = On
error_log = /var/log/php/php-error.log
error_reporting = E_ALL
