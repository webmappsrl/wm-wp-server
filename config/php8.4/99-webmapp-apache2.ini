; Valori del server WordPress diversi dal php.ini-production — oc:8834
; Ricavati dal diff con /usr/lib/php/8.1/php.ini-production del 22/10/2026.
; Va in /etc/php/8.4/apache2/conf.d/. Le Deprecated restano fuori dal log di produzione.
memory_limit = 1G
max_execution_time = 60
post_max_size = 50M
upload_max_filesize = 50M
display_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
